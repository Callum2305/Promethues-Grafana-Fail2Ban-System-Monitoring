# my global config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alert_rules.yml"
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  # node exporter for lubuntu on local host port 9100
  - job_name: "node_exporter_Lubuntu"
    static_configs:
      - targets: ["localhost:9100"]

  # node exporter for Rocky Linux using Rockys IP on port 9100
  - job_name: "node_exporter_Rocky"
    static_configs:
      - targets: ["192.168.56.10:9100"]
